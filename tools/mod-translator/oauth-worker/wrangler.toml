name = "pzmc-mod-translator-oauth"
main = "index.js"
compatibility_date = "2024-12-01"

# Secrets (set via CLI, never commit these):
#   npx wrangler secret put GITHUB_OAUTH_CLIENT_SECRET
#
# Non-secret vars:
[vars]
GITHUB_OAUTH_CLIENT_ID = "REPLACE_WITH_YOUR_OAUTH_APP_CLIENT_ID"
ALLOWED_ORIGINS = "https://project-zomboid-community-modding.github.io"
